name: Build and Publish GPU Containers

on:
  push:
    branches:
      - main
      - feature/sarek-integration
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push-cuda:
    name: Build & Push CUDA Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CUDA container
        run: |
          echo "Building CUDA container..."
          docker build --progress=plain -f Dockerfile.cuda -t ghcr.io/${{ github.repository }}:cuda . 2>&1 | tee build-cuda.log
          docker run --rm --user 65534:65534 -e HOME=/tmp ghcr.io/${{ github.repository }}:cuda bash -c "clang++-15 --version && test -f /usr/local/cuda/nvvm/libdevice/libdevice.10.bc && bqsr --version"

      - name: Tag and Push CUDA container
        run: |
          docker tag ghcr.io/${{ github.repository }}:cuda ghcr.io/${{ github.repository }}:latest
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            docker tag ghcr.io/${{ github.repository }}:cuda ghcr.io/${{ github.repository }}:${{ github.ref_name }}-cuda
            docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}-cuda || true
          fi
          echo "Pushing CUDA container :cuda..."
          docker push ghcr.io/${{ github.repository }}:cuda 2>&1 | tee push-cuda.log || {
            echo "Retrying CUDA container push in 10s..."
            sleep 10
            docker push ghcr.io/${{ github.repository }}:cuda 2>&1 | tee -a push-cuda.log
          }
          echo "Pushing CUDA container :latest..."
          docker push ghcr.io/${{ github.repository }}:latest 2>&1 | tee -a push-cuda.log || {
            echo "Retrying latest container push in 10s..."
            sleep 10
            docker push ghcr.io/${{ github.repository }}:latest 2>&1 | tee -a push-cuda.log
          }

      - name: Report CUDA error
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MSG="CUDA job failure on ${{ github.sha }}:"$'\n```\n'
          [ -f push-cuda.log ] && MSG+="$(cat push-cuda.log)"
          [ -f build-cuda.log ] && MSG+="$(tail -n 50 build-cuda.log)"
          MSG+=$'\n```'
          gh api /repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$MSG" || true

  build-and-push-rocm:
    name: Build & Push AMD ROCm Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ROCm container
        run: |
          echo "Building ROCm container..."
          docker build --progress=plain -f Dockerfile.rocm -t ghcr.io/${{ github.repository }}:rocm . 2>&1 | tee build-rocm.log
          docker run --rm --user 65534:65534 -e HOME=/tmp ghcr.io/${{ github.repository }}:rocm bash -c "clang++-15 --version && bqsr --version"

      - name: Tag and Push ROCm container
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            docker tag ghcr.io/${{ github.repository }}:rocm ghcr.io/${{ github.repository }}:${{ github.ref_name }}-rocm
            docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}-rocm || true
          fi
          echo "Pushing ROCm container :rocm..."
          docker push ghcr.io/${{ github.repository }}:rocm 2>&1 | tee push-rocm.log || {
            echo "Retrying ROCm container push in 10s..."
            sleep 10
            docker push ghcr.io/${{ github.repository }}:rocm 2>&1 | tee -a push-rocm.log
          }

      - name: Report ROCm error
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MSG="ROCm job failure on ${{ github.sha }}:"$'\n```\n'
          [ -f push-rocm.log ] && MSG+="$(cat push-rocm.log)"
          [ -f build-rocm.log ] && MSG+="$(tail -n 50 build-rocm.log)"
          MSG+=$'\n```'
          gh api /repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$MSG" || true
